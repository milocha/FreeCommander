name: FreeCommander
options:
  bundleIdPrefix: pl.mkrolikowski
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_LANGUAGE: pl
targets:
  FreeCommander:
    type: application
    platform: macOS
    sources:
      - path: FreeCommander
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
    info:
      path: FreeCommander/Info.plist
      properties:
        CFBundleDisplayName: FreeCommander
        CFBundleIconFile: FreeCommander
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.file-management
        LSMinimumSystemVersion: "14.0"
  FreeCommanderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: FreeCommander
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FreeCommander.app/Contents/MacOS/FreeCommander"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  FreeCommander:
    build:
      targets:
        FreeCommander: all
        FreeCommanderTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FreeCommanderTests
